[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schedule-picker"
version = "1.0.0"
description = "Generate conflict-free university timetables from a DUOC course-section CSV export"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "aframuz" }]
dependencies = [
    "textual>=0.79",
    "texttable>=1.7",
]

[project.scripts]
schedule-picker = "schedule_picker.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyinstaller>=6.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/schedule_picker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
